  <g font-family="SFMono-Regular, Consolas, monospace" xml:space="preserve"><text x="24" y="43" fill="#a8e6a3" font-size="15">=== Homebrew (Formulae) Packages ===</text>
<text x="24" y="66" fill="#e7e7e7" font-size="15">jq                             v1.8.0</text>
<text x="24" y="89" fill="#e7e7e7" font-size="15">ripgrep                        v14.1.0</text>
<text x="24" y="112" fill="#e7e7e7" font-size="15"></text>
